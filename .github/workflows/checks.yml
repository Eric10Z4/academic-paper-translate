name: Regression and package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt build 'setuptools>=77' wheel
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check private file exclusions during packaging
        run: |
          python -c "from pathlib import Path; [Path(p).write_text('PACKAGING_PRIVATE_SENTINEL') for p in ('config.local.json', 'config.yaml', '.env', 'private-backup.zip', 'private-history.bundle')]"
          git check-ignore config.local.json config.yaml .env private-backup.zip private-history.bundle
          python -m build --no-isolation
          python -B tests/check_distributions.py dist
      - name: Install and verify the wheel outside the source tree
        run: |
          python -c "import pathlib,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',str(next(pathlib.Path('dist').glob('*.whl')))])"
          python -B tests/check_installed.py
