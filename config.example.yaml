# Academic Paper Translate Configuration

# Default translation provider: deepseek | cpa | openai | ollama
provider: "deepseek"

# Provider Settings
providers:
  # DeepSeek official / SiliconFlow API
  deepseek:
    base_url: "https://api.deepseek.com/v1"
    api_key: "your-deepseek-api-key"
    model: "deepseek-chat"
    timeout: 60

  # Local CPA (Cherry Studio / Antigravity proxy)
  cpa:
    base_url: "http://127.0.0.1:8317/v1"
    api_key: "your-cpa-api-key"
    model: "gemini-3.8-flash-high"
    timeout: 60

  # Standard OpenAI-Compatible Endpoint
  openai:
    base_url: "https://api.openai.com/v1"
    api_key: "your-openai-api-key"
    model: "gpt-4o-mini"
    timeout: 60

  # Local Ollama (Offline)
  ollama:
    base_url: "http://127.0.0.1:11434/v1"
    api_key: "ollama"
    model: "qwen2.5:14b"
    timeout: 120

# Translation Parameters
translation:
  lang_in: "English"
  lang_out: "Simplified Chinese"
  # Default prompt template path (relative to repo root)
  prompt_template: "prompts/zotero_default.txt"
  # Parallel workers for paragraph-by-paragraph translation
  workers: 4
  # Whether to inject Chinese CTEX package into LaTeX main entry
  inject_ctex: true
