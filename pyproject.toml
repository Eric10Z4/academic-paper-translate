[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-paper-translate"
dynamic = ["version", "dependencies"]
description = "Hermes academic translation with protected LaTeX sources, checked local compilation, and explicit PDF fallback."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eric10Z4" }
]
keywords = [
    "academic-translation",
    "pdf-translation",
    "latex",
    "arxiv",
    "zotero",
    "paper-reading",
    "deepseek",
    "gemini"
]
[project.optional-dependencies]
pdf = [
    "uv>=0.6"
]

[project.scripts]
paper-translate = "academic_paper_translate.scripts.zotero_translate:main"

[tool.setuptools]
packages = ["academic_paper_translate", "academic_paper_translate.scripts", "academic_paper_translate.adapters"]
package-dir = { academic_paper_translate = "." }
include-package-data = false

[tool.setuptools.package-data]
academic_paper_translate = ["VERSION", "prompts/*.txt", "config.example.json"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
dependencies = { file = "requirements.txt" }
